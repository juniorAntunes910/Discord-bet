version: '3.8'
services:
  postgres:
    image: postgres:15
    container_name: discord_db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: discord_bet
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: discord_redis
    ports:
      - "6379:6379"

volumes:
  pgdata:
  